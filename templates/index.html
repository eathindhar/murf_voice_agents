<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 12 - AI Voice Agent UI Revamp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style src="/static/style.css"></style>
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="chat-container text-center">
            <h4 class="mb-3">AI Voice Agent</h4>
            <p class="mb-4 text-muted">Press the button to start the conversation.</p>
            <div class="d-flex justify-content-center mb-4">
                <button id="recordBtn" class="record-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-mic-fill" viewBox="0 0 16 16">
                        <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0V3z"/>
                        <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5z"/>
                    </svg>
                </button>
            </div>
            <div id="statusDisplay" class="status-display">Ready to chat!</div>
            
            <!-- Transcription Display Area -->
            <div id="transcriptionDisplay" class="transcription-container d-none">
                <div class="transcription-label text-start">Live Transcription:</div>
                <div id="currentTranscript" class="transcription-text text-start">
                    Waiting for speech...
                </div>
            </div>
            
            <audio id="audioPlayer" hidden></audio>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
